{% load static %}
<article class="patient-document-card wow fadeInUp"{% if delay %} data-wow-delay="{{ delay }}"{% endif %}>
  <div class="patient-document-card-number" aria-hidden="true">{{ number }}</div>
  <div class="patient-document-card-body">
    <div class="patient-document-card-icon" aria-hidden="true">
      <i class="fa-regular fa-file-pdf"></i>
      <span class="patient-document-filetype">{{ document.file_extension }}</span>
    </div>
    <div class="patient-document-card-content">
      <h3>{{ document.title }}</h3>
      <p>{{ document.description }}</p>
    </div>
  </div>
  <div class="patient-document-card-actions">
    {% if document.file %}
    <a href="{{ document.file.url }}" class="patient-document-btn" download>
      <i class="fa-solid fa-download" aria-hidden="true"></i>
      <span>Download</span>
    </a>
    <a href="{{ document.file.url }}" class="patient-document-btn patient-document-btn-secondary" target="_blank" rel="noopener noreferrer">
      <i class="fa-solid fa-up-right-from-square" aria-hidden="true"></i>
      <span>View</span>
    </a>
    {% elif document.static_file %}
    <a href="{% static document.static_file %}" class="patient-document-btn" download>
      <i class="fa-solid fa-download" aria-hidden="true"></i>
      <span>Download</span>
    </a>
    <a href="{% static document.static_file %}" class="patient-document-btn patient-document-btn-secondary" target="_blank" rel="noopener noreferrer">
      <i class="fa-solid fa-up-right-from-square" aria-hidden="true"></i>
      <span>View</span>
    </a>
    {% endif %}
  </div>
</article>
