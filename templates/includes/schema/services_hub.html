<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ request.scheme }}://{{ request.get_host }}{% url 'website:home' %}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Our Services",
      "item": "{{ request.build_absolute_uri }}"
    }
  ]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": "{{ hub_meta_title|escapejs }}",
  "description": "{{ meta_description|escapejs }}",
  "numberOfItems": {{ service_count }},
  "itemListElement": [
    {% for item in items %}
    {
      "@type": "ListItem",
      "position": {{ forloop.counter }},
      "name": "{{ item.title|escapejs }}",
      "url": "{{ request.scheme }}://{{ request.get_host }}{% url 'website:service-detail' item.slug %}"
    }{% if not forloop.last %},{% endif %}
    {% endfor %}
  ]
}
</script>
{% if services_faqs %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for question, answer in services_faqs %}
    {
      "@type": "Question",
      "name": "{{ question|escapejs }}",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "{{ answer|escapejs }}"
      }
    }{% if not forloop.last %},{% endif %}
    {% endfor %}
  ]
}
</script>
{% endif %}
