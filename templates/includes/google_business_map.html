<section class="mp-visit-map" aria-label="Clinic location map">
  <div class="mp-container">
    <div class="mp-visit-map__frame">
      <iframe
        class="mp-visit-map__iframe"
        src="{{ site_map_embed_url }}"
        title="{{ site_name }} on Google Maps"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen>
      </iframe>
    </div>
  </div>
</section>
