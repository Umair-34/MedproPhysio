{% load static %}
<div class="cp-topbar">
  <div class="cp-topbar-inner">
    <div class="cp-topbar-info">
      <a href="{{ site_phone_link }}">{{ site_phone }}</a>
      <a href="mailto:{{ site_email }}">{{ site_email }}</a>
    </div>
  </div>
</div>

<header class="cp-header">
  <div class="cp-header-inner">
    <a class="cp-logo" href="{% url 'website:home' %}">
      <picture>
        <source srcset="{% static 'images/medpro-logo.webp' %}" type="image/webp">
        <img src="{% static 'images/medpro-logo.png' %}" alt="{{ site_name }}" width="387" height="266">
      </picture>
    </a>

    <button class="cp-mobile-toggle" type="button" aria-label="Toggle menu" data-cp-nav-toggle>
      <i class="fa-solid fa-bars"></i>
    </button>

    <ul class="cp-nav" id="cp-main-nav">
      <li class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
        <a href="{% url 'website:home' %}">Home</a>
      </li>
      <li class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">
        <a href="{% url 'website:about' %}">About</a>
      </li>
      <li class="{% if 'services' in request.path or request.resolver_match.url_name == 'services' or request.resolver_match.url_name == 'service-detail' %}active{% endif %}">
        <a href="{% url 'website:services' %}">Our Services</a>
        <ul class="sub-menu">
          {% for item in treatments_col1 %}
          <li><a href="{% url 'website:service-detail' item.slug %}">{{ item.title }}</a></li>
          {% endfor %}
          {% for item in treatments_col2 %}
          <li><a href="{% url 'website:service-detail' item.slug %}">{{ item.title }}</a></li>
          {% endfor %}
        </ul>
      </li>
      <li class="{% if request.resolver_match.url_name == 'blog' or request.resolver_match.url_name == 'blog-detail' %}active{% endif %}">
        <a href="{% url 'website:blog' %}">Blog</a>
      </li>
      <li class="cp-nav-cta">
        <a href="{% url 'website:book' %}">Book Appointment</a>
      </li>
    </ul>
  </div>
</header>
