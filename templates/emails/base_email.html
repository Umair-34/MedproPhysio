<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>{% block subject %}{{ clinic_name }}{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#F5F3F0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#2D3439;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{% block preheader %}{% endblock %}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F3F0; padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:100%; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 6px 24px rgba(45,52,57,0.08);">
          <tr>
            <td style="background-color:#2F3438; padding:32px 40px; text-align:center;">
              {% if logo_url %}
              <img src="{{ logo_url }}" alt="{{ clinic_name }}" width="180" style="display:block;margin:0 auto 14px auto;border:0;max-width:180px;height:auto;">
              {% endif %}
              <div style="font-family:'Marcellus', Georgia, 'Times New Roman', serif; color:#ffffff; font-size:24px; letter-spacing:0.3px;">{{ clinic_name }}</div>
              <div style="color:#D1D5DB; font-size:13px; margin-top:6px;">{{ clinic_address_short }}</div>
            </td>
          </tr>
          <tr>
            <td style="height:6px; background-color:#8B2E2E;"></td>
          </tr>
          <tr>
            <td style="padding:36px 40px 8px 40px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px 36px 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #E5E1DB; padding-top:20px;">
                <tr>
                  <td style="padding-top:20px; font-size:13px; line-height:20px; color:#5C6570;">
                    <strong style="color:#2D3439;">{{ clinic_name }}</strong><br>
                    {{ clinic_address }}<br>
                    <a href="tel:{{ clinic_phone_link }}" style="color:#8B2E2E; text-decoration:none;">{{ clinic_phone }}</a>
                    &nbsp;|&nbsp;
                    <a href="mailto:{{ clinic_email }}" style="color:#8B2E2E; text-decoration:none;">{{ clinic_email }}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:100%;">
          <tr>
            <td style="padding:18px 40px; text-align:center; font-size:12px; color:#8a93a3;">
              This email was sent by {{ clinic_name }} regarding your appointment.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
